# Swoopdl Fluent -- distinct Swoopdl-branded design (not the Win preset).
# Built on Swoopdl's existing theme DSL; IDM Classic remains available.
# No command, persistence, network, scheduler or download behavior changes.
#
name = "Swoopdl Fluent"
inherits = "classic"
icon-set = "metro" # Reuse the already-shipped monochrome-capable icon collection.
icons = "mono"

[controls]
button = "fluent"
check = "fluent"
field-focus = "line"
progress = "line"
scroll = "overlay"
caption = "system"
focus = "ring"

[sizes]
# Radius steps by hierarchy. Nested radius <= parent (menu-item 6 in popup 10).
radius = 6
"radius.button" = 6
"radius.part" = 4
"radius.check" = 3
"radius.flyout" = 10
"radius.menu-item" = 6
"radius.egui" = 8
"radius.popup" = 10
# Two-line rows (name + speed/ETA) fit in 40; header recedes at 32.
"list.row" = 40
"list.header" = 32

# One size for UI and body; hierarchy comes from weight and muted color.
"font.ui" = 13
"font.ui.bold" = 13
"font.body" = 13
"font.small" = 12

[seeds.light]
background = "#EEF1F3"
surface = "#FBFCFC"
header = "#E4E9ED"
text = "#18222B"
accent = "#2F4D6B"
selection = "#CBDBEA"
error = "#B3203A"
warning = "#A24A0A"
success = "#17704A"

[seeds.dark]
background = "#13171C"
surface = "#1A2027"
header = "#222A33"
text = "#EDF1F4"
accent = "#8DB4DA"
selection = "#33485F"
error = "#FF8FA4"
warning = "#FFA270"
success = "#6FD0A0"

[light]
tree-chevrons = true
tree = "#FBFCFC"
"tree.frame" = "#D3DBE2"
menubar = "#EEF1F3"
"menubar.bottom" = "#EEF1F3"
"menubar.line" = "#DAE0E5"
"menu.border" = "#C6D0D9"
