"toolbar.hot" = "#E6EDF3"
"toolbar.hot.faint" = "#F2F5F8"
"toolbar.pressed" = "#C4D4E4"
"toolbar.hot.border" = "#B2C3D4"
"toolbar.hot.edge" = "#AFC0D1"
"list.frame" = "#D3DBE2"
"table.line" = "#E3E8EC"
"header.sep" = "#CBD4DC"
"tab.page" = "#FBFCFC"
"group.line" = "#D3DBE2"
caption = "#EEF1F3"

# Selected is clearly stronger than hover; inactive goes neutral.
selection = "#CBDBEA"
"selection.inactive" = "#E2E7EC"
"selection.text" = "#18222B"
"selection.muted" = "#4B5C6B"

"text.muted" = "#4B5C6B"
