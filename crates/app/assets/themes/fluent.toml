# Swoopdl Fluent -- default Windows 11-inspired presentation preset.
# Built on Swoopdl's existing theme DSL; IDM Classic remains available.
# No command, persistence, network, scheduler or download behavior changes.
name = "Swoopdl Fluent"
inherits = "classic"
icon-set = "metro" # Reuse the already-shipped monochrome-capable icon collection.
icons = "mono"

[controls]
button = "fluent"
check = "fluent"
field-focus = "line"
progress = "line"
scroll = "overlay"
caption = "system"
focus = "ring"

[sizes]
radius = 4
"radius.button" = 4
"radius.part" = 4
"radius.check" = 3
"radius.flyout" = 8
"radius.menu-item" = 5
"radius.egui" = 5
"radius.popup" = 8
"list.row" = 41
"list.header" = 37

"font.ui" = 14
"font.ui.bold" = 14
"font.body" = 13
"font.small" = 12

[seeds.light]
background = "#F3F3F3"
surface = "#FFFFFF"
header = "#F7F7F7"
text = "#1B1B1B"
accent = "#0067C0"
selection = "#0067C0"
error = "#B42318"
warning = "#885000"
success = "#116D2E"

[seeds.dark]
background = "#202124"
surface = "#2C2D31"
header = "#26272B"
text = "#F3F4F7"
accent = "#78B9F0"
selection = "#115483"
error = "#FF9A9A"
warning = "#FFD27A"
success = "#7DD59B"

[light]
"tree-chevrons" = true
"tree" = "#FFFFFF"
"tree.frame" = "#E0E2E5"
"menubar" = "#F7F7F7"
"menubar.bottom" = "#F7F7F7"
"menubar.line" = "#E3E3E3"
"menu.border" = "#E1E1E1"
"menu.hot" = "#E8F2FB"
"toolbar.hot" = "#E8F2FB"
"toolbar.hot.faint" = "#F0F7FD"
"toolbar.pressed" = "#D5E8F9"
"toolbar.hot.border" = "#BCD8F0"
"toolbar.hot.edge" = "#BCD8F0"
"list.frame" = "#E0E2E5"
"table.line" = "#EEEEEE"
"header.sep" = "#E2E2E2"
"tab.page" = "#FFFFFF"
"group.line" = "#E0E2E5"
"selection.inactive" = "#E8F3FF"
caption = "#F3F3F3"

"text.muted" = "#63676E"
"selection" = "#E8F3FF"
"selection.text" = "#1B1B1B"
"selection.muted" = "#63676E"
"header" = "#FAFAFA"
"list.grid" = "#E0E2E5"
"subtle.hot" = "#F0F2F5"
"egui.window" = "#F7F7F7"
"button.accent.text" = "#FFFFFF"

