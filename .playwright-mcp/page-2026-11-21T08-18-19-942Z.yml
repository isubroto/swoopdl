      - generic [ref=e646]:
        - generic [ref=e647]:
          - heading "In short" [level=2] [ref=e648]
          - paragraph [ref=e649]:
            - strong [ref=e650]: Swoopdl (SDL)
            - text: is a free, open-source download manager for Windows 10 and 11, with builds for Linux and macOS. It looks and works like Internet Download Manager (IDM), but it is free (GPL-3.0), downloaded a 1 GiB file 5.4 times faster than IDM 6.42 in our published benchmark, and also downloads torrents, magnet links and videos from web pages. A browser extension for Chrome, Edge, Brave, Opera, Vivaldi and Firefox hands downloads to it.
