# Swoopdl Fluent -- distinct Swoopdl-branded design (not the Win preset).
# Built on Swoopdl's existing theme DSL; IDM Classic remains available.
# No command, persistence, network, scheduler or download behavior changes.
#
name = "Swoopdl Fluent"
inherits = "classic"
icon-set = "fluent"
icons = "mono"

[controls]
button = "fluent"
check = "fluent"
field-focus = "line"
progress = "line"
scroll = "overlay"
caption = "system"
focus = "ring"

[sizes]
# Radius steps by hierarchy. Nested radius <= parent (menu-item 6 in popup 10).
radius = 6
"radius.button" = 6
"radius.part" = 4
"radius.check" = 3
"radius.flyout" = 10
"radius.menu-item" = 6
"radius.egui" = 8
"radius.popup" = 10
# Two-line rows (name + speed/ETA) fit in 40; header recedes at 32.
"list.row" = 40
"list.header" = 32

# One size for UI and body; hierarchy comes from weight and muted color.
"font.ui" = 13
"font.ui.bold" = 13
"font.body" = 13
"font.small" = 12

# Additional Win-compatible roles; existing Fluent values retained.
"border" = 1
"focus-line" = 2
"font.dialog" = 13
"font.dialog.bold" = 14
"font.title" = 19
"font.heading" = 19
"tooltip.width" = 360
"tooltip.margin-x" = 12
"tooltip.margin-top" = 9
"tooltip.margin-bottom" = 10

[seeds.light]
background = "#EEF1F3"
surface = "#FBFCFC"
header = "#E4E9ED"
text = "#18222B"
accent = "#2F4D6B"
selection = "#CBDBEA"
error = "#B3203A"
warning = "#A24A0A"
success = "#17704A"

[seeds.dark]
