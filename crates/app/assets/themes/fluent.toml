# Swoopdl Fluent -- distinct Swoopdl-branded design (not the Win preset).
# Built on Swoopdl's existing theme DSL; IDM Classic remains available.
# No command, persistence, network, scheduler or download behavior changes.
name = "Swoopdl Fluent"
inherits = "classic"
icon-set = "metro" # Reuse the already-shipped monochrome-capable icon collection.
icons = "mono"

[controls]
button = "fluent"
check = "fluent"
field-focus = "line"
progress = "line"
scroll = "overlay"
caption = "system"
focus = "ring"

[sizes]
radius = 10
"radius.button" = 10
"radius.part" = 8
"radius.check" = 5
"radius.flyout" = 14
"radius.menu-item" = 10
"radius.egui" = 12
"radius.popup" = 14
"list.row" = 43
"list.header" = 40

"font.ui" = 14
"font.ui.bold" = 14
"font.body" = 13
"font.small" = 12

[seeds.light]
background = "#F4F7FB"
surface = "#FFFFFF"
header = "#EDF2F8"
text = "#1C283A"
accent = "#2869C8"
selection = "#E2ECFC"
error = "#B42340"
warning = "#8B5C0E"
success = "#116C49"

[seeds.dark]
background = "#151922"
surface = "#1C2431"
header = "#252F3E"
text = "#F2F5FA"
accent = "#75A7F5"
selection = "#293B55"
error = "#FF8FA4"
