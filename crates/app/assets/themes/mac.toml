# Swoopdl Mac: independent macOS 27 "Golden Gate"-inspired appearance.
# Original design tokens; does not distribute Apple system assets or proprietary fonts.
# Full native Liquid Glass, traffic-light chrome and system materials are future phases.
#
# What macOS 27 changed from Tahoe, and where it lands here:
#   - Less default transparency, better diffusion  -> every surface is solid and tinted.
#   - One uniform toolbar / window surface          -> menubar, caption, toolbar, egui.window share `background`.
#   - Edge-to-edge sidebar, darker when active      -> `tree` is its own tint, framed by a hairline only.
#   - Uniform, concentric corner radii              -> popup 14 > menu-item 8 (14 - 6 inset); capsule buttons.
#   - Neutral Apple grays, accent only for state    -> blue appears only on selection, primary action, progress, focus.
#   - Selected row = solid accent + white text; window/list unfocused = neutral gray.
# Approximate system values (Apple says they drift between releases): systemBlue #007AFF / #0A84FF,
# grays #E5E5EA #D1D1D6 #8E8E93 (light) and #48484A #3A3A3C #2C2C2E #1C1C1E (dark).
name = "Mac"
inherits = "classic"
icon-set = "mac"
icons = "mono" # Tint the Mac symbols with the theme's text colour.

[controls]
button = "fluent"
check = "fluent"
field-focus = "ring"
progress = "line"
scroll = "overlay"
caption = "system"
focus = "ring"

[sizes]
radius = 10
"radius.button" = 14   # >= half the button height reads as the macOS 26/27 capsule; lower it if your painter does not clamp.
"radius.part" = 8
"radius.check" = 5
"radius.flyout" = 14
"radius.menu-item" = 8
"radius.egui" = 14
"radius.popup" = 14
"list.row" = 40
"list.header" = 30
"font.ui" = 14
"font.ui.bold" = 14
"font.body" = 14
"font.small" = 12

[seeds.light]
background = "#F2F2F2"
surface = "#FFFFFF"
header = "#F7F7F7"
text = "#262626"
accent = "#007AFF"
selection = "#0063E1"
error = "#D70015"
warning = "#C93400"
success = "#248A3D"

[seeds.dark]
background = "#2C2C2E"
surface = "#1E1E1E"
header = "#262628"
text = "#ECECEE"
accent = "#0A84FF"
selection = "#0A5CD6"
error = "#FF453A"
warning = "#FF9F0A"
success = "#30D158"

[light]
tree-chevrons = true
# Sidebar and content
tree = "#EFEFF1"
"tree.frame" = "#D9D9DC"
"list.frame" = "#D9D9DC"
