# Win — Windows 11-inspired Swoopdl appearance built on Rust/egui.
# Separate built-in theme ID "win". Does not replace Swoopdl Fluent or Classic.
# All roles are resolved by the existing centralized theme painters.
# Native Mica/Acrylic is not claimed here: opaque surfaces remain the safe fallback.
name = "Win"
inherits = "classic"
icon-set = "metro"
icons = "mono"

[controls]
button = "fluent"
check = "fluent"
field-focus = "line"
progress = "line"
scroll = "overlay"
caption = "system"
focus = "ring"

# WinUI-style 4 pt control corners, 8 pt flyouts, spacious table and header.
[sizes]
radius = 4
"radius.button" = 4
"radius.part" = 3
"radius.check" = 3
"radius.flyout" = 8
"radius.menu-item" = 4
"radius.egui" = 4
"radius.popup" = 8
"border" = 1
"focus-line" = 2
"list.row" = 40
"list.header" = 36
"font.dialog" = 13
"font.dialog.bold" = 14
"font.title" = 19
"font.ui" = 14
"font.ui.bold" = 14
"font.small" = 12
"font.body" = 13
"font.heading" = 19
"tooltip.width" = 360
"tooltip.margin-x" = 12
"tooltip.margin-top" = 9
"tooltip.margin-bottom" = 10

[seeds.light]
background = "#F3F3F3"
surface = "#FFFFFF"
header = "#F9F9F9"
text = "#1B1B1B"
accent = "#0067C0"
selection = "#DCEBFA"
error = "#B42318"
warning = "#8A5200"
success = "#116D2E"

[seeds.dark]
background = "#202020"
surface = "#2C2C2C"
header = "#282828"
text = "#F5F5F5"
accent = "#79C6FF"
selection = "#304E69"
error = "#FF9A9A"
warning = "#FFD27A"
success = "#81D7A1"

