# Gold ring = brand eye ring. ~3.5:1 on surfaces.
"focus.ring" = "#B87A00"
link = "#25547F"
"highlight.hot" = "#E6EDF3"
# The one warm color. ~3.2:1 against white so the bar reads on its track.
"progress.bar" = "#BF8100"
"meter.fill" = "#BF8100"
"check.on" = "#2F4D6B"
"check.on.hot" = "#264159"
"check.on.pressed" = "#1D3348"

